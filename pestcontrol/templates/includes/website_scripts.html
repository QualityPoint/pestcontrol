    <!-- Language Switcher -->
    <script>
        document.querySelectorAll("[data-set-lang]").forEach(function (link) {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                var lang = link.getAttribute("data-set-lang");
                document.cookie = "preferred_language=" + lang + ";path=/;max-age=31536000";
                window.location.reload();
            });
        });
    </script>

    <!-- Contact Form Submit -->
    <script>
        document.querySelectorAll("#contactForm").forEach(function (form) {
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                var msgBox = form.querySelector("#msgSubmit");
                var formData = new FormData(form);
                fetch("/api/method/pestcontrol.pc_website.api.submit_contact_form", {
                    method: "POST",
                    body: formData,
                    headers: { "X-Frappe-CSRF-Token": frappe && frappe.csrf_token ? frappe.csrf_token : "" },
                })
                    .then(function (response) {
                        if (!response.ok) throw new Error("Request failed");
                        return response.json();
                    })
                    .then(function () {
                        if (msgBox) {
                            msgBox.classList.remove("hidden");
                            msgBox.classList.add("text-success");
                            msgBox.textContent = "Your message has been sent successfully.";
                        }
                        form.reset();
                    })
                    .catch(function () {
                        if (msgBox) {
                            msgBox.classList.remove("hidden");
                            msgBox.classList.add("text-danger");
                            msgBox.textContent = "Something went wrong. Please try again.";
                        }
                    });
            });
        });
    </script>
